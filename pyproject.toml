[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-squad"
version = "0.1.0"
description = "Claude Code as master, pluggable AI workers (local Ollama, Gemini on Google AI Pro accounts, later Codex)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
squad = "agent_squad.cli:main"
agent-squad = "agent_squad.cli:main"

[tool.setuptools.packages.find]
include = ["agent_squad*"]
